<text x="40" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#FC4C02" >02</text><text x="72" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#F5F5F5" letter-spacing="3">FEATURED PROJECT</text><line x1="246" y1="42" x2="960" y2="42" stroke="#1C1C1C"/><rect x="40" y="76" width="920" height="320" rx="14" fill="#0A0A0A" stroke="url(#og)" stroke-opacity="0.7"/><g><text x="72" y="132" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="#F5F5F5" letter-spacing="-1.5">RunAI v2</text><text x="72" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#FC4C02" letter-spacing="2">RACE-TRIP PLANNER FOR RUNNERS</text></g><g><text x="72" y="200" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#CFCFCF" >Finds real races with official dates (Linkup), then</text><text x="72" y="224" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#CFCFCF" >three browser agents (H Company) prepare registration,</text><text x="72" y="248" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#CFCFCF" >hotel and transport in parallel. They stop before</text><text x="72" y="272" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#CFCFCF" >any payment or account creation.</text></g><g><rect x="72" y="310" width="71" height="28" rx="14" fill="#0d0d0d" stroke="#333"/><text x="84" y="329" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#D0D0D0" >Python</text><rect x="150.8" y="310" width="79" height="28" rx="14" fill="#0d0d0d" stroke="#333"/><text x="162.8" y="329" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#D0D0D0" >FastAPI</text><rect x="237.4" y="310" width="86" height="28" rx="14" fill="#0d0d0d" stroke="#333"/><text x="249.4" y="329" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#D0D0D0" >Pydantic</text><rect x="331.8" y="310" width="102" height="28" rx="14" fill="#0d0d0d" stroke="#333"/><text x="343.8" y="329" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#D0D0D0" >JavaScript</text><rect x="441.8" y="310" width="71" height="28" rx="14" fill="#0d0d0d" stroke="#333"/><text x="453.8" y="329" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#D0D0D0" >pytest</text><text x="72" y="370" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8A8A8A" >Started at the Computer Use Agents Hackathon · H Company x 42AI · Nov 2026</text></g><rect x="560" y="186" width="96" height="40" rx="8" fill="#111" stroke="#333"/><text x="608" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F5F5F5" text-anchor="middle">LINKUP</text><text x="608" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8A8A8A" text-anchor="middle">sourced races</text><path id="l0" d="M656 206 C700 206 700 130 740 130 L865 130" fill="none" stroke="#2a2a2a" stroke-width="2"/><path d="M656 206 C700 206 700 130 740 130 L865 130" fill="none" stroke="#FC4C02" stroke-width="2" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;0;0" keyTimes="0;0.6;1" dur="3.5s" begin="0.0s" repeatCount="indefinite"/></path><circle r="5" fill="#fff"><animateMotion dur="3.5s" begin="0.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"><mpath href="#l0"/></animateMotion></circle><text x="750" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#BDBDBD" letter-spacing="1.5">REGISTRATION</text><path id="l1" d="M656 206 C700 206 700 206 740 206 L865 206" fill="none" stroke="#2a2a2a" stroke-width="2"/><path d="M656 206 C700 206 700 206 740 206 L865 206" fill="none" stroke="#FC4C02" stroke-width="2" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;0;0" keyTimes="0;0.6;1" dur="3.5s" begin="0.25s" repeatCount="indefinite"/></path><circle r="5" fill="#fff"><animateMotion dur="3.5s" begin="0.25s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"><mpath href="#l1"/></animateMotion></circle><text x="750" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#BDBDBD" letter-spacing="1.5">HOTEL</text><path id="l2" d="M656 206 C700 206 700 282 740 282 L865 282" fill="none" stroke="#2a2a2a" stroke-width="2"/><path d="M656 206 C700 206 700 282 740 282 L865 282" fill="none" stroke="#FC4C02" stroke-width="2" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;0;0" keyTimes="0;0.6;1" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></path><circle r="5" fill="#fff"><animateMotion dur="3.5s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"><mpath href="#l2"/></animateMotion></circle><text x="750" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#BDBDBD" letter-spacing="1.5">TRANSPORT</text><rect x="867" y="110" width="4" height="196" fill="#FC4C02"/><text x="885" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#FC4C02" letter-spacing="2">STOP</text><text x="885" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monosp