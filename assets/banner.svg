<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Iba Demesy, Software Engineer at xpln.ai">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110f"/>
      <stop offset="1" stop-color="#231610"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FC4C02"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FC4C02" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FC4C02" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .name{font:800 64px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1px}
      .role{font:600 24px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#orange)}
      .tag{font:500 17px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9c2bc}
      .km{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#FF8A3D;letter-spacing:2px}
      .route{stroke-dasharray:1400;stroke-dashoffset:1400;animation:run 3.2s ease-out forwards}
      .dot{opacity:0;animation:pop .4s ease-out 3s forwards}
      @keyframes run{to{stroke-dashoffset:0}}
      @keyframes pop{to{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#orange)"/>

  <text x="64" y="128" class="name">Iba Demesy</text>
  <text x="66" y="172" class="role">Software Engineer @ xpln.ai</text>
  <text x="66" y="212" class="tag">Data pipelines · AI agents · Data science</text>
  <text x="66" y="240" class="tag">Télécom Paris · Paris, France</text>

  <path d="M640 250 C 690 250, 700 190, 750 200 S 820 120, 870 150 S 940 230, 990 170 S 1080 90, 1140 110 L1140 290 L640 290 Z" fill="url(#fade)"/>
  <path class="route" d="M640 250 C 690 250, 700 190, 750 200 S 820 120, 870 150 S 940 230, 990 170 S 1080 90, 1140 110" fill="none" stroke="url(#orange)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="640" cy="250" r="7" fill="#fff" stroke="#FC4C02" stroke-width="3"/>
  <g class="dot">
    <circle cx="1140" cy="110" r="9" fill="#FC4C02"/>
    <circle cx="1140" cy="110" r="16" fill="none" stroke="#FC4C02" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <text x="640" y="282" class="km">START</text>
  <text x="1068" y="80" class="km">42.195 KM</text>
</svg>
